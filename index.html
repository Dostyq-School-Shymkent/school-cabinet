<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>DOSTYQ кабинеті</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: a centred sign-in card; after sign-in one student card, same content as the printed student card, laid out as a responsive page. */
:root{
  --bg:#f2f3f7; --card:#ffffff; --ink:#0f1a33; --muted:#69718a; --line:#e2e5ee; --soft:#f4f6fa;
  --accent:#1e3a8a; --accent-soft:#e3e9f8; --onaccent:#ffffff; --gold:#d4a017;
  --good:#15803d; --good-bg:#dcf2e3; --warn:#c2620a; --warn-bg:#fcebd9; --bad:#c0392b; --bad-bg:#f9e0dc;
  --navy1:#2b4cb0; --navy2:#16296a; --shadow:0 1px 2px rgba(15,26,51,.05),0 8px 28px rgba(15,26,51,.07);
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1220; --card:#151d31; --ink:#e8ecf6; --muted:#98a1b8; --line:#26304a; --soft:#1b253d;
  --accent:#8fa8f0; --accent-soft:#22305a; --onaccent:#0c1220; --gold:#e3b53c;
  --good:#5fd08a; --good-bg:#16372a; --warn:#f2a25c; --warn-bg:#3d2a15; --bad:#ff8a7a; --bad-bg:#40201d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1220; --card:#151d31; --ink:#e8ecf6; --muted:#98a1b8; --line:#26304a; --soft:#1b253d;
  --accent:#8fa8f0; --accent-soft:#22305a; --onaccent:#0c1220; --gold:#e3b53c;
  --good:#5fd08a; --good-bg:#16372a; --warn:#f2a25c; --warn-bg:#3d2a15; --bad:#ff8a7a; --bad-bg:#40201d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.panel>*,.sub,.wrap>*{min-width:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;line-height:1.45;font-size:15px;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.01em}
.logo{height:34px;width:auto;display:block}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);position:relative;overflow:hidden;flex:none}
.mark::after{content:"";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 36px 36px;border-color:transparent transparent var(--gold) transparent}
/* sign-in */
.login{min-height:calc(100dvh - 68px);display:grid;place-items:center}
.lbox{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:28px;box-shadow:var(--shadow);display:grid;gap:20px}
.lbox h1{margin:0;font-size:24px;line-height:1.2;text-wrap:balance}
.lbox p{margin:0;color:var(--muted);font-size:14px}
form{display:grid;gap:16px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{display:flex;align-items:center;background:var(--soft);border:2px solid transparent;border-radius:14px;transition:border-color .15s}
.inp:focus-within{border-color:var(--accent)}
.inp input{flex:1;min-width:0;border:0;background:transparent;padding:14px 16px;font-size:16px;outline:none;color:var(--ink)}
.inp button{border:0;background:none;color:var(--muted);padding:0 14px;cursor:pointer;font-size:13px;font-weight:600;height:100%}
.go{border:0;background:var(--accent);color:var(--onaccent);border-radius:14px;padding:14px 18px;font-weight:600;font-size:16px;cursor:pointer}
.go:disabled{opacity:.55;cursor:wait}
.err{color:var(--bad);font-size:14px;min-height:21px;margin:0}
.hint{font-size:13px;color:var(--muted)}
/* student card */
.wrap{max-width:900px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.out{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.panel{background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow);display:grid;gap:20px;min-width:0}
.who{display:flex;gap:16px;align-items:center}
.av{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);border:3px solid var(--gold);display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--accent);flex:none}
.who h2{margin:0;font-size:clamp(22px,4vw,28px);line-height:1.15;text-wrap:balance}
.who span{color:var(--muted);font-size:14px}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;width:max-content;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,26,51,.12)}
.kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
.k{border-radius:20px;padding:16px 18px;background:var(--soft);display:flex;flex-direction:column;gap:4px;min-width:0}
.k small{color:var(--muted);font-weight:600;font-size:13px}
.k b{font-size:clamp(34px,7vw,52px);font-weight:600;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.k b i{font-style:normal;font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.k em{font-style:normal;color:var(--muted);font-size:13px}
.k.main{background:linear-gradient(135deg,var(--navy1),var(--navy2));color:#fff;position:relative;overflow:hidden}
.k.main small,.k.main b i,.k.main em{color:rgba(255,255,255,.85)}
.k.main::after{content:"";position:absolute;right:-26px;top:-30px;width:110px;height:110px;border-radius:50%;border:16px solid rgba(212,160,23,.55)}
.k.main em.hl{color:#f4d46a;font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}
h3{margin:0;font-size:18px}
.sub{display:grid;gap:16px}
.sr{display:grid;gap:6px}
.sh{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sh b{font-weight:600}.sh span{font-variant-numeric:tabular-nums;color:var(--muted)}.sh strong{color:var(--ink);font-size:17px}
.bar{position:relative;height:12px;border-radius:99px;background:var(--soft);overflow:visible}
.bar i{display:block;height:100%;border-radius:99px}
.bar u{position:absolute;top:-4px;width:3px;height:20px;border-radius:2px;background:var(--ink);opacity:.75;transform:translateX(-1px)}
.sn{font-size:12.5px;color:var(--muted)}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ins li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;align-items:start}
.ins i{width:10px;height:10px;border-radius:50%;margin-top:7px}
.chart{background:var(--soft);border-radius:20px;padding:10px 8px 4px}
.chart svg{display:block;width:100%;height:auto;max-height:260px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:360px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:600}
td:first-child small{color:var(--muted);font-weight:500;margin-left:4px}
.c{display:inline-block;min-width:52px;padding:5px 10px;border-radius:99px;font-weight:700}
.c.good{background:var(--good-bg);color:var(--good)}.c.warn{background:var(--warn-bg);color:var(--warn)}.c.bad{background:var(--bad-bg);color:var(--bad)}
td .ps{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
tr.tot td{font-weight:700;font-size:16px;border-bottom:0;background:var(--soft)}
tr.tot td:first-child{border-radius:12px 0 0 12px}tr.tot td:last-child{border-radius:0 12px 12px 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.empty{background:var(--soft);border-radius:20px;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:620px){.kpis{grid-template-columns:1fr 1fr}.k.main{grid-column:1/-1}.panel{padding:16px;border-radius:20px}.who{gap:12px}.av{width:52px;height:52px;font-size:18px}}
@media (max-width:620px){table{min-width:0}th,td{padding:8px 3px}th{letter-spacing:0;font-size:11px}.c{min-width:38px;padding:4px 7px;font-size:13px}td:first-child{font-size:13px;width:34%}td:first-child small{display:block;margin:0}tr.tot td{font-size:14px}.sh strong{font-size:16px}}
.rolesel{width:100%}.rolesel button{flex:1;padding:9px 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--soft);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}.chip b{color:var(--ink);font-weight:600;margin-right:6px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:9px 12px;font-weight:600;color:var(--ink);font-size:14px;max-width:100%}
.pbar{display:inline-block;width:56px;height:8px;border-radius:99px;background:var(--soft);vertical-align:middle;margin-right:6px;overflow:hidden}.pbar i{display:block;height:100%;border-radius:99px}
.hv{font-weight:700}.hv.good{color:var(--good)}.hv.warn{color:var(--warn)}.hv.bad{color:var(--bad)}.hv.mut,.mut{color:var(--muted);font-weight:500}
.tw td small{color:var(--muted);font-weight:500}
td.l,th.l{text-align:left}
.tw td:first-child small{margin-left:4px}
.kpis4{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:12px}
.sec{display:grid;gap:12px}
.secH{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tw td:not(:first-child){white-space:nowrap}
@media (max-width:620px){table.wide{min-width:520px}.tw td:first-child{min-width:118px}}
@media (max-width:620px){.kpis4{grid-template-columns:1fr 1fr}.kpis4 .k.main{grid-column:1/-1}.rolesel button{font-size:13px;padding:8px 4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const ITER = 200000;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAP = {'ә':'а','ғ':'г','қ':'к','ң':'н','ө':'о','ұ':'у','ү':'у','һ':'х','і':'и','ё':'е','i':'и'};
const fold = s => String(s).trim().toLowerCase().split('').map(c => MAP[c] || c).join('').split(/\s+/).filter(Boolean).sort().join(' ');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder(), dec = new TextDecoder();
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const f1 = x => x.toFixed(1).replace('.', ',');
const sg = d => d > 0 ? '+' + d : d < 0 ? '−' + Math.abs(d) : '0';
const COL = {good:'var(--good)', warn:'var(--warn)', bad:'var(--bad)'};
const lv = p => p >= .7 ? 'good' : p >= .5 ? 'warn' : 'bad';

async function derive(login, pw, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(fold(login) + '|' + pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
// Returns the student's record, or null. Nothing is stored: the record only opens with the right login and password.
async function openRecord(login, pw, role){
  const f = fold(login);
  const id = hex(await crypto.subtle.digest('SHA-256', enc.encode('dq-idx|' + (role === 'S' ? '' : role + '|') + f))).slice(0, 16);
  const cands = REC.filter(r => r.i === id);
  if (!cands.length){ await derive(login, pw, new Uint8Array(16)); return null; }
  for (const r of cands){
    try{
      const key = await derive(login, pw, b64(r.s));
      const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(r.v)}, key, b64(r.c));
      return JSON.parse(dec.decode(plain));
    }catch(e){}
  }
  return null;
}

const ini = n => { const i = n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); return i === 'АМ' ? 'МА' : i };

/* ---------- sign in ---------- */
let fails = 0;
$('#eye').addEventListener('click', e => {
  const b = e.currentTarget, show = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', show); b.textContent = show ? 'Жасыру' : 'Көрсету';
  $('#pw').type = show ? 'text' : 'password';
});
$('#lf').addEventListener('submit', async e => {
  e.preventDefault();
  const go = $('#go'), err = $('#err');
  let pw = $('#pw').value.replace(/\s/g, '');
  if (ROLE === 'S' && /^\d{12}$/.test(pw)) pw = pw.slice(-6);
  const login = $('#lg').value;
  if (!fold(login)){ err.textContent = 'Аты-жөніңізді жазыңыз.'; return; }
  if (ROLE === 'S' ? !/^\d{6}$/.test(pw) : !/^\d{12}$/.test(pw)){ err.textContent = ROLE === 'S' ? 'Пароль ЖСН-нің соңғы 6 санынан тұрады.' : 'Пароль ЖСН-нің барлық 12 санынан тұрады.'; return; }
  go.disabled = true; go.textContent = 'Тексеріп жатыр…'; err.textContent = '';
  let rec = null;
  try{ rec = await openRecord(login, pw, ROLE); }catch(x){ err.textContent = 'Бұл браузер кіруді қолдамайды. Басқа браузермен ашыңыз.'; go.disabled = false; go.textContent = 'Кіру'; return; }
  if (rec){ fails = 0; $('#pw').value = ''; route(rec); go.disabled = false; go.textContent = 'Кіру'; return; }
  fails++; err.textContent = ROLE === 'S' ? 'Аты-жөні немесе пароль дұрыс емес. Тегі мен атын тізімдегідей жазыңыз.' : 'Аты-жөні немесе пароль дұрыс емес, не болмаса бұл рөл бойынша сыныбыңыз жоқ. Басқа рөлді (Мұғалім / Ментор) таңдап көріңіз.';
  const wait = Math.min(8, fails * 1.5);
  go.textContent = `Қайта көріңіз (${Math.ceil(wait)} с)`;
  setTimeout(() => { go.disabled = false; go.textContent = 'Кіру'; }, wait * 1000);
});
$('#out').addEventListener('click', () => {
  $('#card').innerHTML = ''; $('#view').hidden = true; $('#login').hidden = false; $('#lg').value = ''; $('#pw').value = ''; $('#lg').focus(); window.scrollTo(0, 0);
});

/* ---------- student card ---------- */
function show(R){
  $('#login').hidden = true; $('#view').hidden = false; window.scrollTo(0, 0);
  const card = $('#card'), ts = R.ts;
  const head = `<div class="who"><span class="av" aria-hidden="true">${esc(ini(R.n))}</span><div><h2>${esc(R.n)}</h2><span>${esc(R.g)} сынып${R.k ? ' · Жетекші: ' + esc(R.k) : ''}</span></div></div>`;
  if (!ts.length){
    card.innerHTML = head + '<div class="empty">Сізде әзірге толық сынақ нәтижесі жоқ. Нәтиже шыққан соң осы жерде көрінеді.</div>';
    return;
  }
  card.innerHTML = head + `
    <div class="seg" id="seg" role="group" aria-label="Сынақ">${ts.map((t, i) => `<button type="button" data-i="${i}" aria-pressed="${i === ts.length - 1}">${esc(t.n)}</button>`).join('')}</div>
    <div id="main" class="sub" style="gap:20px"></div>
    <div class="sub"><h3>Жалпы балл динамикасы</h3><div class="chart" id="chart"></div></div>
    <div class="sub"><h3>Барлық сынақтар бойынша</h3><div class="tw" id="tbl"></div>
      <div class="legend"><span><i style="background:var(--good-bg)"></i>70% және жоғары</span><span><i style="background:var(--warn-bg)"></i>50–69%</span><span><i style="background:var(--bad-bg)"></i>50%-дан төмен</span></div></div>
    <p class="note">Нәтиже шекті балл (50) мен соңғы сынақтарға негізделген. Сұрақ болса, сынып жетекшіңізге хабарласыңыз.</p>`;
  card.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', () => { card.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); drawMain(R, +b.dataset.i); }));
  drawMain(R, ts.length - 1); drawChart(R); drawTable(R);
}

function parts(t, p){
  const row = (l, k, m, pk) => {
    let pv = null;
    if (p){ if (pk){ if (p[pk] === t[pk]) pv = p['s' + pk.slice(1)] || 0 } else pv = p[k] || 0 }
    const sk = pk ? 's' + pk.slice(1) : k, v = t[sk] || 0;
    return {l, m, v, pv, p: v / m};
  };
  return [row('Оқу сауаттылығы','OS',10), row('Математикалық сауаттылық','MS',10), row('Қазақстан тарихы','KT',20), row(t.p1 || 'Бейіндік пән 1','s1',50,'p1'), row(t.p2 || 'Бейіндік пән 2','s2',50,'p2')];
}
function drawMain(R, i){
  const t = R.ts[i], P = i > 0 ? R.ts[i - 1] : null, ps = parts(t, P), d = P ? t.tot - P.tot : null;
  const kpi = `<div class="kpis">
    <div class="k main"><small>${esc(t.n)} · жалпы балл</small><b>${t.tot}<i>/140</i></b><em class="${t.tot >= 50 ? 'hl' : ''}">${t.tot >= 50 ? 'Шекті балдан ' + (t.tot - 50) + ' балл жоғары' : 'Шекті балға дейін ' + (50 - t.tot) + ' балл'}</em></div>
    <div class="k"><small>${P ? 'Өзгеріс' : 'Шекті баллдан'}</small><b class="${(P ? d : t.tot - 50) >= 0 ? 'up' : 'down'}">${P ? sg(d) : sg(t.tot - 50)}</b><em>${P ? esc(P.n) + ': ' + P.tot + ' балл' : 'Шекті балл: 50'}</em></div>
    <div class="k"><small>Сыныптағы орны</small><b>${t.rank}<i>/ ${t.cn}</i></b><em>${esc(t.n)} бойынша</em></div></div>`;
  const rows = ps.map(x => {
    const c = lv(x.p), w = Math.max(2, x.p * 100);
    const note = x.pv == null ? (P ? 'Алдыңғы сынақта басқа пән болған' : Math.round(x.p * 100) + '% (максимумнан)') :
      `${esc(P.n)}: ${x.pv}/${x.m} → ${esc(t.n)}: ${x.v}/${x.m} · <span class="${x.v >= x.pv ? 'up' : 'down'}">${x.v === x.pv ? 'өзгеріссіз' : x.v > x.pv ? (x.v - x.pv) + ' балға өсті' : (x.pv - x.v) + ' балға төмендеді'}</span>`;
    return `<div class="sr"><div class="sh"><b>${esc(x.l)}</b><span><strong>${x.v}</strong>/${x.m}</span></div>
      <div class="bar" role="img" aria-label="${esc(x.l)}: ${x.v} / ${x.m}"><i style="width:${w}%;background:${COL[c]}"></i>${x.pv == null ? '' : `<u style="left:${x.pv / x.m * 100}%" title="Алдыңғы сынақ"></u>`}</div><div class="sn">${note}</div></div>`;
  }).join('');
  // short analysis
  const out = [], s = [...ps].sort((a, b) => b.p - a.p), b = s[0], w = s[s.length - 1];
  out.push(['var(--good)', `Күшті жағы: ${b.l}, ${b.v}/${b.m} (${Math.round(b.p * 100)}%).`]);
  out.push(['var(--bad)', `Көбірек көңіл бөлу керек: ${w.l}, ${w.v}/${w.m} (${Math.round(w.p * 100)}%).`]);
  if (P){
    const g = ps.filter(x => x.pv != null).map(x => ({...x, dd: x.v - x.pv})).sort((a, b) => b.dd - a.dd);
    if (d < 0) out.push(['var(--bad)', `${P.n}-мен салыстырғанда жалпы балыңыз ${Math.abs(d)} балға төмендеді. Қателерді сынып жетекшімен бірге талдаңыз.`]);
    else if (g.length && g[0].dd > 0) out.push(['var(--good)', `${P.n}-мен салыстырғанда ең көп өскені: ${g[0].l} (+${g[0].dd} балл).`]);
  } else if (t.tot < 50) out.push(['var(--warn)', `Шекті балға (50) дейін ${50 - t.tot} балл жетпейді. Бейіндік пәннен бастау тиімді.`]);
  else if (t.cn > 1) out.push([t.tot >= t.cavg ? 'var(--good)' : 'var(--warn)', `Сыныптың орташа балы ${f1(t.cavg)}. Сіздің балыңыз одан ${f1(Math.abs(t.tot - t.cavg))} балл ${t.tot >= t.cavg ? 'жоғары' : 'төмен'}.`]);
  $('#main').innerHTML = kpi + `<div class="sub"><h3>Пәндер бойынша</h3>${rows}<p class="note">Қара белгі алдыңғы сынақтағы деңгейді көрсетеді.</p></div>
    <div class="sub"><h3>Талдау</h3><ul class="ins">${out.slice(0, 3).map(([c, s]) => `<li><i style="background:${c}"></i><span>${esc(s)}</span></li>`).join('')}</ul></div>`;
}

function drawChart(R){
  const ts = R.ts, n = ts.length, W = 640, H = 230, L = 46, Rr = 30, T = 38, B = 50;
  const vals = ts.map(t => t.tot);
  const lo = Math.max(0, Math.floor((Math.min(...vals) - 12) / 10) * 10), hi = Math.min(140, Math.ceil((Math.max(...vals) + 10) / 10) * 10);
  const y = v => H - B - (v - lo) / (hi - lo) * (H - B - T), x = i => n === 1 ? (L + W - Rr) / 2 : L + 20 + i * (W - L - Rr - 40) / (n - 1);
  let g = '';
  [lo, (lo + hi) / 2, hi].forEach(v => { g += `<line x1="${L}" x2="${W - Rr + 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1.5"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${Math.round(v)}</text>`; });
  if (50 > lo && 50 < hi) g += `<line x1="${L}" x2="${W - Rr + 10}" y1="${y(50)}" y2="${y(50)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6 6"/><text x="${W - Rr + 10}" y="${y(50) - 6}" text-anchor="end" font-size="12" fill="var(--bad)">шекті балл 50</text>`;
  const line = n > 1 ? `<polyline fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="${vals.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>` : '';
  const dots = vals.map((v, i) => { const last = i === n - 1; return `<circle cx="${x(i)}" cy="${y(v)}" r="${last ? 9 : 6}" fill="${last ? 'var(--gold)' : 'var(--accent)'}" ${last ? 'stroke="var(--card)" stroke-width="3"' : ''}/><text x="${x(i)}" y="${y(v) - 16}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${v}</text><text x="${x(i)}" y="${H - 16}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--muted)">${esc(ts[i].n)}</text>`; }).join('');
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Жалпы балл динамикасы: ${ts.map(t => t.n + ' ' + t.tot).join(', ')}">${g}${line}${dots}</svg>`;
}
function drawTable(R){

/* ================= teacher & mentor cabinets ================= */
const cmpG = (a, b) => String(a).localeCompare(String(b), 'kk', {numeric: true});
const pc = x => Math.round(x * 100);
const sum = a => a.reduce((s, x) => s + x, 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const sgp = d => (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(Math.round(d));
const sg1 = d => Math.abs(d) < .05 ? '0' : (d > 0 ? '+' : '−') + f1(Math.abs(d));
const totLv = v => v >= 70 ? 'good' : v >= 50 ? 'warn' : 'bad';
const selH = (id, opts, cur) => `<select class="sel" id="${id}" aria-label="${esc(id)}">${opts.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
const segH = (id, tests, i) => `<div class="seg" id="${id}" role="group" aria-label="Сынақ">${tests.map((t, j) => `<button type="button" data-i="${j}" aria-pressed="${j === i}">${esc(t.n)}</button>`).join('')}</div>`;
const headH = (R, sub) => `<div class="who"><span class="av" aria-hidden="true">${esc(ini(R.n))}</span><div><h2>${esc(R.n)}</h2><span>${sub}</span></div></div>`;
const kH = (l, b, e, c) => `<div class="k${c ? ' ' + c : ''}"><small>${l}</small><b>${b}</b><em>${e}</em></div>`;
const insH = L => `<ul class="ins">${L.map(([c, s]) => `<li><i style="background:${c}"></i><span>${esc(s)}</span></li>`).join('')}</ul>`;
const legendH = '<div class="legend"><span><i style="background:var(--good-bg)"></i>70% және жоғары</span><span><i style="background:var(--warn-bg)"></i>50–69%</span><span><i style="background:var(--bad-bg)"></i>50%-дан төмен</span></div>';
const GOOD = 'var(--good)', BAD = 'var(--bad)', WARN = 'var(--warn)';

function route(R){
  if (R.role === 'T') showTeacher(R); else if (R.role === 'M') showMentor(R); else show(R);
}

/* ---------- teacher ---------- */
function showTeacher(R){
  $('#login').hidden = true; $('#view').hidden = false; window.scrollTo(0, 0);
  const card = $('#card');
  const tests = R.tests.filter(t => R.roles.some(ro => R.data[ro.g + '|' + ro.key].some(s => s.v[t.k] != null)));
  const classes = [...new Set(R.roles.map(r => r.g))].sort(cmpG);
  const lab = {}; R.roles.forEach(r => lab[r.key] = r.label);
  const keys = Object.keys(lab);
  const chips = keys.map(k => `<span class="chip"><b>${esc(lab[k])}</b>${R.roles.filter(r => r.key === k).map(r => r.g).sort(cmpG).map(esc).join(', ')}</span>`).join('');
  const head = headH(R, 'Мұғалім · ' + classes.length + ' сынып');
  if (!tests.length){ card.innerHTML = head + `<div class="chips">${chips}</div><div class="empty">Сіз сабақ беретін сыныптарда әзірге толық сынақ нәтижесі жоқ.</div>`; return; }
  let ti = tests.length - 1, cg = classes[0], srt = 'low';
  card.innerHTML = head + `<div class="chips">${chips}</div><div class="ctl">${segH('tseg', tests, ti)}</div><div id="tb" class="sub" style="gap:24px"></div>
    <p class="note">Бұл бетте тек сіз сабақ беретін сыныптар мен өз пәніңіздің нәтижелері көрінеді. Шектен төмен: пән бойынша максимумның 50%-ынан аз.</p>`;
  const rowsOf = (ro, k) => R.data[ro.g + '|' + ro.key].filter(s => s.v[k] != null).map(s => ({n: s.n, v: s.v[k], s}));
  const prevOf = (rows, i) => { for (let j = i - 1; j >= 0; j--){ const pk = tests[j].k, pairs = rows.map(r => ({...r, pv: r.s.v[pk]})).filter(p => p.pv != null); if (pairs.length >= 3) return {pn: tests[j].n, pairs, d: avg(pairs.map(p => p.v - p.pv)), n: pairs.length}; } return null; };
  function draw(){
    const k = tests[ti].k, tn = tests[ti].n;
    const S = R.roles.map(ro => { const rows = rowsOf(ro, k), n = rows.length, s = sum(rows.map(r => r.v)); return {ro, rows, n, sum: s, avg: n ? s / n : 0, pct: n ? s / (n * ro.max) : 0, risk: rows.filter(r => r.v / ro.max < .5), pv: n ? prevOf(rows, ti) : null}; })
      .filter(x => x.n > 0).sort((a, b) => cmpG(a.ro.g, b.ro.g) || a.ro.label.localeCompare(b.ro.label, 'kk'));
    if (!S.length){ $('#tb').innerHTML = `<div class="empty">${esc(tn)} сынағына сіздің сыныптарыңыз қатыспаған. Басқа сынақты таңдаңыз.</div>`; return; }
    const uniq = new Set(), risky = new Set();
    S.forEach(x => x.rows.forEach(r => { uniq.add(x.ro.g + r.n); if (r.v / x.ro.max < .5) risky.add(x.ro.g + r.n + x.ro.key); }));
    const nAll = uniq.size, den = sum(S.map(x => x.n * x.ro.max)), pct = sum(S.map(x => x.sum)) / den;
    let bw = 0, bs = 0; S.forEach(x => { const b = R.bench[x.ro.key] && R.bench[x.ro.key][k]; if (b && b.s != null){ const w = x.n * x.ro.max; bs += b.s * w; bw += w; } });
    const bench = bw ? bs / bw : null;
    const gr = S.filter(x => x.pv), gn = sum(gr.map(x => x.pv.n)), growth = gn ? sum(gr.map(x => x.pv.d / x.ro.max * 100 * x.pv.n)) / gn : null;
    const rosterN = sum([...new Set(S.map(x => x.ro.g))].map(g => R.roles.find(r => r.g === g).rn));
    const kpi = `<div class="kpis4">
      ${kH('Пән нәтижесі · ' + esc(tn), pc(pct) + '<i>%</i>', bench != null ? `${sgp((pct - bench) * 100)} п.т. мектеп орташасынан` : 'максимумнан орташа', 'main')}
      ${kH('Тапсырған оқушы', nAll, 'сынып: ' + new Set(S.map(x => x.ro.g)).size + ' · тізімде ' + rosterN)}
      ${kH('Өсім', growth == null ? '—' : `<span class="${growth >= 0 ? 'up' : 'down'}">${sgp(growth)}</span><i>п.т.</i>`, gn ? esc(gr[0].pv.pn) + '-мен салыстырғанда' : 'алдыңғы сынақ жоқ')}
      ${kH('Назар керек', risky.size, 'пән нәтижесі 50%-дан төмен')}</div>`;
    const tbl = `<div class="tw"><table class="wide"><thead><tr><th class="l">Сынып</th><th class="l">Пән</th><th>Тапсырған</th><th>Орташа</th><th>Нәтиже</th><th>Өзгеріс</th><th>Назар</th></tr></thead><tbody>${S.map(x => {
      const c = lv(x.pct), d = x.pv ? x.pv.d : null;
      return `<tr><td>${esc(x.ro.g)}</td><td class="l" style="font-weight:500">${esc(x.ro.label)}</td><td>${x.n}<small>/${x.ro.rn}</small></td><td>${f1(x.avg)}<small>/${x.ro.max}</small></td><td><span class="pbar"><i style="width:${Math.max(3, x.pct * 100)}%;background:${COL[c]}"></i></span><b style="color:${COL[c]}">${pc(x.pct)}%</b></td><td class="${d == null ? 'mut' : d >= 0 ? 'up' : 'down'}">${d == null ? '—' : sg1(d)}</td><td>${x.risk.length ? `<b class="down">${x.risk.length}</b>` : '<span class="mut">0</span>'}</td></tr>`;
    }).join('')}</tbody></table></div>`;
    // school comparison per subject key
    const kk = [...new Set(S.map(x => x.ro.key))];
    const cmp = kk.map(key => { const xs = S.filter(x => x.ro.key === key), mine = sum(xs.map(x => x.sum)) / sum(xs.map(x => x.n * x.ro.max)), b = R.bench[key] && R.bench[key][k];
      const bar = `<div class="sr"><div class="sh"><b>${esc(lab[key])}</b><span><strong>${pc(mine)}%</strong>${b && b.r ? ' · мектепте ' + b.r + '/' + b.c + '-орын' : ''}</span></div><div class="bar"><i style="width:${Math.max(2, mine * 100)}%;background:${COL[lv(mine)]}"></i>${b && b.s != null ? `<u style="left:${b.s * 100}%" title="Мектеп орташасы"></u>` : ''}</div><div class="sn">${b && b.s != null ? 'Қара белгі: мектеп бойынша осы пәннің орташасы, ' + pc(b.s) + '%' : ''}</div></div>`; return bar; }).join('');
    // dynamics across tests
    const dyn = `<div class="tw"><table><thead><tr><th class="l">Пән</th>${tests.map(t => `<th${t.k === k ? ' style="color:var(--accent)"' : ''}>${esc(t.n)}</th>`).join('')}</tr></thead><tbody>${keys.map(key => `<tr><td>${esc(lab[key])}</td>${tests.map(t => { let s = 0, d = 0; R.roles.filter(r => r.key === key).forEach(ro => rowsOf(ro, t.k).forEach(r => { s += r.v; d += ro.max; })); return d ? `<td><span class="c ${lv(s / d)}">${pc(s / d)}%</span></td>` : '<td class="mut">—</td>'; }).join('')}</tr>`).join('')}</tbody></table></div>`;
    // insights
    const ins = [];
    ins.push([bench != null && pct < bench - .02 ? WARN : GOOD, `${tn} бойынша сіз сабақ беретін ${new Set(S.map(x => x.ro.g)).size} сыныптың ${nAll} оқушысы тапсырды. Пән көрсеткіші ${pc(pct)}%` + (bench != null ? `, мектеп орташасы ${pc(bench)}%.` : '.')]);
    const big = S.filter(x => x.n >= 5);
    if (big.length > 1){ const b = [...big].sort((a, c) => c.pct - a.pct), top = b[0], low = b[b.length - 1];
      ins.push([GOOD, `Ең күшті: ${top.ro.g} · ${top.ro.label}, ${pc(top.pct)}% (орташа ${f1(top.avg)}/${top.ro.max}).`]);
      if (low !== top) ins.push([BAD, `Ең әлсіз: ${low.ro.g} · ${low.ro.label}, ${pc(low.pct)}% (орташа ${f1(low.avg)}/${low.ro.max}). Қателер талдауы қажет.`]); }
    const gg = S.filter(x => x.pv && x.pv.n >= 5).map(x => ({x, p: x.pv.d / x.ro.max * 100})).sort((a, b) => b.p - a.p);
    if (gg.length){ const up = gg[0], dn = gg[gg.length - 1];
      if (up.p > 0) ins.push([GOOD, `Ең көп өскен: ${up.x.ro.g} · ${up.x.ro.label}, ${sg1(up.x.pv.d)} балл (${up.x.pv.pn}-мен салыстырғанда).`]);
      if (dn.p < 0 && dn !== up) ins.push([BAD, `Төмендеген: ${dn.x.ro.g} · ${dn.x.ro.label}, ${sg1(dn.x.pv.d)} балл. Қайталау жоспарын жасаңыз.`]); }
    if (risky.size){ const w = [...S].sort((a, b) => b.risk.length / b.n - a.risk.length / a.n)[0]; ins.push([WARN, `Назар аударатын оқушы: ${risky.size}. Ең көбі: ${w.ro.g} · ${w.ro.label}, ${w.risk.length}/${w.n}. Төмендегі кестеде қызыл түспен белгіленген.`]); }
    // students
    const sel = R.roles.filter(ro => cg === '*' || ro.g === cg).sort((a, b) => cmpG(a.g, b.g) || a.label.localeCompare(b.label, 'kk'));
    const items = [];
    sel.forEach(ro => R.data[ro.g + '|' + ro.key].forEach(s => { let pv = null; for (let j = ti - 1; j >= 0; j--){ if (s.v[tests[j].k] != null){ pv = s.v[tests[j].k]; break; } } items.push({s, ro, v: s.v[k], pv}); }));
    items.sort((a, b) => { if ((a.v == null) !== (b.v == null)) return a.v == null ? 1 : -1; if (srt === 'name') return a.s.n.localeCompare(b.s.n, 'kk'); if (a.v == null) return a.s.n.localeCompare(b.s.n, 'kk');
      const pa = a.v / a.ro.max, pb = b.v / b.ro.max; return srt === 'high' ? pb - pa : pa - pb; });
    const showCls = cg === '*', multi = new Set(sel.map(r => r.key)).size > 1 || sel.length > 1 && showCls;
    const stRows = items.map(i => { const hist = tests.map(t => { const v = i.s.v[t.k]; return v == null ? '<span class="hv mut">—</span>' : `<span class="hv ${lv(v / i.ro.max)}">${v}</span>`; }).join('<span class="mut"> · </span>');
      return `<tr><td>${esc(i.s.n)}</td>${showCls ? `<td>${esc(i.ro.g)}</td>` : ''}${multi ? `<td class="l" style="font-weight:500">${esc(i.ro.label)}</td>` : ''}<td>${i.v == null ? '<span class="mut">тапсырмаған</span>' : `<span class="c ${lv(i.v / i.ro.max)}">${i.v}</span><small>/${i.ro.max}</small>`}</td><td class="${i.v == null || i.pv == null ? 'mut' : i.v >= i.pv ? 'up' : 'down'}">${i.v == null || i.pv == null ? '—' : sg1(i.v - i.pv)}</td><td>${hist}</td></tr>`; }).join('');
    const cnt = items.filter(i => i.v != null).length;
    const stud = `<div class="secH"><h3>Оқушылар</h3><div class="ctl">${selH('tcls', [...classes.map(g => [g, g + ' сынып']), ['*', 'Барлық сыныптар']], cg)}${selH('tsrt', [['low', 'Төмен баллдан'], ['high', 'Жоғары баллдан'], ['name', 'Аты бойынша']], srt)}</div></div>
      <div class="tw"><table class="wide"><thead><tr><th class="l">Оқушы</th>${showCls ? '<th>Сынып</th>' : ''}${multi ? '<th class="l">Пән</th>' : ''}<th>${esc(tn)}</th><th>Өзгеріс</th><th>${tests.map(t => esc(t.n)).join(' · ')}</th></tr></thead><tbody>${stRows}</tbody></table></div>
      <p class="note">Тапсырған: ${cnt} / ${items.length}. «Өзгеріс» алдыңғы сынақпен салыстырғанда, пән баллы бойынша.</p>`;
    $('#tb').innerHTML = kpi + `<div class="sec"><h3>Сыныптар мен пәндер</h3>${tbl}</div><div class="sec"><h3>Мектеп бойынша салыстыру</h3>${cmp}</div><div class="sec"><h3>Сынақтар бойынша динамика</h3>${dyn}${legendH}</div><div class="sec"><h3>Талдау</h3>${insH(ins.slice(0, 6))}</div><div class="sec">${stud}</div>`;
    $('#tcls').addEventListener('change', e => { cg = e.target.value; draw(); });
    $('#tsrt').addEventListener('change', e => { srt = e.target.value; draw(); });
  }
  card.querySelectorAll('#tseg button').forEach(b => b.addEventListener('click', () => { ti = +b.dataset.i; card.querySelectorAll('#tseg button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); }));
  draw();
}

/* ---------- mentor (class curator) ---------- */
function showMentor(R){
  $('#login').hidden = true; $('#view').hidden = false; window.scrollTo(0, 0);
  const card = $('#card');
  const tests = R.tests.filter(t => R.cls.some(c => c.st.some(s => s.ts.some(x => x.k === t.k))));
  const head = headH(R, 'Ментор (сынып жетекшісі) · ' + R.cls.map(c => c.g).join(', '));
  if (!tests.length){ card.innerHTML = head + '<div class="empty">Сіздің сыныбыңызда әзірге толық сынақ нәтижесі жоқ.</div>'; return; }
  let ti = tests.length - 1, ci = 0, srt = 'low';
  card.innerHTML = head + `<div class="ctl">${segH('mseg', tests, ti)}${R.cls.length > 1 ? selH('mcls', R.cls.map((c, i) => [i, c.g + ' сынып']), ci) : ''}</div><div id="mb" class="sub" style="gap:24px"></div>
    <p class="note">Бұл бетте тек сіз жетекшілік ететін сынып оқушыларының нәтижелері көрінеді. Шекті балл: 50 (140-тан).</p>`;
  function draw(){
    const c = R.cls[ci], k = tests[ti].k, tn = tests[ti].n, sch = R.sch[k];
    const tOf = (s, kk) => s.ts.find(x => x.k === kk);
    const rows = c.st.map(s => ({s, t: tOf(s, k)})), have = rows.filter(r => r.t), none = rows.filter(r => !r.t);
    if (!have.length){ $('#mb').innerHTML = `<div class="empty">${esc(c.g)} сыныбы ${esc(tn)} сынағына қатыспаған. Басқа сынақты таңдаңыз.</div>`; return; }
    const prevT = s => { for (let j = ti - 1; j >= 0; j--){ const t = tOf(s, tests[j].k); if (t) return t; } return null; };
    const av = avg(have.map(r => r.t.tot)), o50 = have.filter(r => r.t.tot >= 50).length, low = have.filter(r => r.t.tot < 50);
    const kpi = `<div class="kpis4">
      ${kH(esc(c.g) + ' · ' + esc(tn) + ' · орташа балл', f1(av) + '<i>/140</i>', sch ? `<span class="${av >= sch.tot ? 'hl' : ''}">мектеп орташасы ${f1(sch.tot)} · ${sg1(av - sch.tot)}</span>` : '', 'main')}
      ${kH('Тапсырған оқушы', have.length, 'сынып тізімінде ' + c.rn)}
      ${kH('Шектен жоғары', pc(o50 / have.length) + '<i>%</i>', o50 + ' оқушы 50+ балл')}
      ${kH('Назар керек', low.length, '50 баллдан төмен')}</div>`;
    // subjects
    const sub = [['Оқу сауаттылығы', avg(have.map(r => r.t.OS)) / 10, sch && sch.OS], ['Математикалық сауаттылық', avg(have.map(r => r.t.MS)) / 10, sch && sch.MS], ['Қазақстан тарихы', avg(have.map(r => r.t.KT)) / 20, sch && sch.KT]];
    const pm = {}; have.forEach(r => { [[r.t.p1, r.t.s1], [r.t.p2, r.t.s2]].forEach(([p, v]) => { if (p) (pm[p] = pm[p] || []).push(v); }); });
    Object.entries(pm).filter(([, v]) => v.length >= 3).sort((a, b) => b[1].length - a[1].length).forEach(([p, v]) => sub.push([p + ' (бейіндік)', avg(v) / 50, null, v.length]));
    const subH = sub.map(([l, p, b, n]) => `<div class="sr"><div class="sh"><b>${esc(l)}</b><span><strong>${pc(p)}%</strong>${n ? ' · ' + n + ' оқушы' : ''}</span></div><div class="bar"><i style="width:${Math.max(2, p * 100)}%;background:${COL[lv(p)]}"></i>${b != null ? `<u style="left:${b * 100}%" title="Мектеп орташасы"></u>` : ''}</div>${b != null ? `<div class="sn">Қара белгі: мектеп орташасы, ${pc(b)}%</div>` : ''}</div>`).join('');
    // dynamics
    const dyn = `<div class="tw"><table><thead><tr><th class="l">Сынақ</th><th>Тапсырған</th><th>Орташа балл</th><th>50+</th><th>Мектеп</th></tr></thead><tbody>${tests.map(t => { const h = c.st.map(s => tOf(s, t.k)).filter(Boolean); if (!h.length) return `<tr><td>${esc(t.n)}</td><td colspan="4" class="mut">нәтиже жоқ</td></tr>`; const a = avg(h.map(x => x.tot)), sc = R.sch[t.k];
      return `<tr${t.k === k ? ' style="background:var(--soft)"' : ''}><td>${esc(t.n)}</td><td>${h.length}<small>/${c.rn}</small></td><td><span class="c ${totLv(a)}">${f1(a)}</span></td><td>${pc(h.filter(x => x.tot >= 50).length / h.length)}%</td><td>${sc ? f1(sc.tot) : '—'}</td></tr>`; }).join('')}</tbody></table></div>`;
    // insights
    const ins = [];
    if (sch) ins.push([av >= sch.tot ? GOOD : WARN, `${c.g} сыныбының ${tn} бойынша орташа балы ${f1(av)}, мектеп орташасы ${f1(sch.tot)} (${sg1(av - sch.tot)}). 50+ балл жинаған: ${o50}/${have.length}.`]);
    const rel = sub.slice(0, 3).filter(x => x[2] != null).map(x => ({l: x[0], d: x[1] - x[2], p: x[1]})).sort((a, b) => b.d - a.d);
    if (rel.length){ ins.push([rel[0].d >= 0 ? GOOD : WARN, `${rel[0].d >= 0 ? 'Мектеппен салыстырғанда ең күшті' : 'Мектеп орташасына ең жақыны'}: ${rel[0].l}, ${pc(rel[0].p)}% (${sgp(rel[0].d * 100)} п.т.).`]); const w = rel[rel.length - 1]; if (w !== rel[0]) ins.push([w.d < 0 ? BAD : WARN, `Көбірек көңіл бөлу керек: ${w.l}, ${pc(w.p)}% (${sgp(w.d * 100)} п.т.).`]); }
    if (low.length) ins.push([WARN, `50 баллдан төмен: ${low.length} оқушы (${[...low].sort((a, b) => a.t.tot - b.t.tot).slice(0, 5).map(r => r.s.n + ' ' + r.t.tot).join(', ')}${low.length > 5 ? '…' : ''}). Жеке жұмыс жоспары қажет.`]);
    const gr = have.map(r => ({r, p: prevT(r.s)})).filter(x => x.p).map(x => ({n: x.r.s.n, d: x.r.t.tot - x.p.tot, pn: x.p.n})).sort((a, b) => b.d - a.d);
    if (gr.length){ if (gr[0].d > 0) ins.push([GOOD, `Ең көп өскен: ${gr[0].n}, ${sgp(gr[0].d)} балл (${gr[0].pn}-мен салыстырғанда).`]); const dn = gr[gr.length - 1]; if (dn.d < 0) ins.push([BAD, `Ең көп төмендеген: ${dn.n}, ${sgp(dn.d)} балл. Себебін сұхбатта анықтаңыз.`]); }
    if (none.length) ins.push([WARN, `${tn} сынағына қатыспаған: ${none.length} оқушы (${none.slice(0, 4).map(r => r.s.n).join(', ')}${none.length > 4 ? '…' : ''}).`]);
    // students
    const list = [...have].map(r => ({...r, pv: prevT(r.s)}));
    list.sort((a, b) => srt === 'name' ? a.s.n.localeCompare(b.s.n, 'kk') : srt === 'high' ? b.t.tot - a.t.tot : a.t.tot - b.t.tot);
    const cell = (v, m, p) => `<td><span class="c ${lv(v / m)}">${v}</span>${p ? `<span class="ps">${esc(p)}</span>` : ''}</td>`;
    const stRows = list.map(r => { const t = r.t, d = r.pv ? t.tot - r.pv.tot : null; return `<tr><td>${esc(r.s.n)}</td>${cell(t.OS, 10)}${cell(t.MS, 10)}${cell(t.KT, 20)}${cell(t.s1, 50, t.p1)}${cell(t.s2, 50, t.p2)}<td><span class="c ${totLv(t.tot)}">${t.tot}</span></td><td class="${d == null ? 'mut' : d >= 0 ? 'up' : 'down'}">${d == null ? '—' : sgp(d)}</td><td>${t.rank}<small>/${t.cn}</small></td></tr>`; }).join('') +
      none.map(r => `<tr><td>${esc(r.s.n)}</td><td colspan="8" class="mut">тапсырмаған</td></tr>`).join('');
    const stud = `<div class="secH"><h3>Сынып оқушылары · ${esc(tn)}</h3>${selH('msrt', [['low', 'Төмен баллдан'], ['high', 'Жоғары баллдан'], ['name', 'Аты бойынша']], srt)}</div>
      <div class="tw"><table class="wide"><thead><tr><th class="l">Оқушы</th><th>ОС</th><th>МС</th><th>ҚТ</th><th>Пән 1</th><th>Пән 2</th><th>Жалпы</th><th>±</th><th>Орын</th></tr></thead><tbody>${stRows}</tbody></table></div>${legendH}
      <p class="note">ОС: оқу сауаттылығы /10, МС: математикалық сауаттылық /10, ҚТ: Қазақстан тарихы /20, бейіндік пәндер /50. «±» алдыңғы сынақпен салыстырғанда жалпы балл.</p>`;
    $('#mb').innerHTML = kpi + `<div class="sec"><h3>Пәндер бойынша</h3>${subH}</div><div class="sec"><h3>Сынақтар бойынша динамика</h3>${dyn}</div><div class="sec"><h3>Талдау</h3>${insH(ins.slice(0, 6))}</div><div class="sec">${stud}</div>`;
    $('#msrt').addEventListener('change', e => { srt = e.target.value; draw(); });
  }
  card.querySelectorAll('#mseg button').forEach(b => b.addEventListener('click', () => { ti = +b.dataset.i; card.querySelectorAll('#mseg button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); }));
  const mc = $('#mcls'); if (mc) mc.addEventListener('change', e => { ci = +e.target.value; draw(); });
  draw();
}
</script>
